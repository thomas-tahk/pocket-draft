name: CI

# Runs on every pull request so a PR has a check to be judged on, and on main
# so a broken main is visible immediately rather than at the next PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [engine, server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Neither module has external dependencies, so there is no go.sum and
          # nothing to cache. Left on, setup-go fails looking for one.
          cache: false

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  wasm:
    name: wasm binary is current
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # public/pd.wasm is committed because Vercel's build image has no Go
    # toolchain, which makes it possible to change the engine and ship a stale
    # binary. Comparing rebuilt bytes is unreliable across machines, so check
    # the thing that actually matters: Go sources changed, binary did not.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Engine changes must rebuild the wasm
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$changed" | grep -qE '^(engine|server)/[^/]*\.go$' \
             && ! echo "$changed" | grep -qx 'public/pd.wasm'; then
            echo "::error::Go sources changed but public/pd.wasm did not. Run 'npm run build:wasm' and commit it."
            exit 1
          fi
          echo "wasm binary is consistent with the Go sources in this PR"

  web:
    name: typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
